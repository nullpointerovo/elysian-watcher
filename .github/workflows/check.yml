
name: Check Discord Invite

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: invite-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    env:
      CHECKS_PER_RUN: 33
      CHECK_INTERVAL_SECONDS: 600

    steps:
      - name: 检出代码 (Checkout)
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 循环检查邀请码
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHOVER_USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          PUSHOVER_API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}

        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          run_one_check() {
            echo "::group::第 $1 / ${CHECKS_PER_RUN} 次检查"

            python check_invite.py

            if ! git diff --quiet state.json; then
              git add state.json
              git commit -m "chore: 更新邀请码监控状态 [skip ci]"

              for attempt in 1 2 3 4; do
                git pull --rebase origin main && git push origin HEAD:main && break
                echo "推送失败，第 ${attempt} 次重试..."
                sleep $((attempt * 2))
              done
            else
              echo "状态没有变化，无需提交。"
            fi

            echo "::endgroup::"
          }

          for i in $(seq 1 "${CHECKS_PER_RUN}"); do
            run_one_check "$i"

            if [ "$i" -lt "${CHECKS_PER_RUN}" ]; then
              echo "等待 ${CHECK_INTERVAL_SECONDS} 秒后进行下一次检查..."
              sleep "${CHECK_INTERVAL_SECONDS}"
            fi
          done
