
name: Test Emergency Pushover

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send emergency test
        env:
          USER_KEY: ${{ secrets.PUSHOVER_USER_KEY }}
          API_TOKEN: ${{ secrets.PUSHOVER_API_TOKEN }}
        run: |
          curl --fail-with-body \
            --form-string "token=$API_TOKEN" \
            --form-string "user=$USER_KEY" \
            --form-string "title=Journey Watcher Test" \
            --form-string "message=Alien Alarm sound test. Please acknowledge this notification." \
            --form-string "priority=2" \
            --form-string "retry=30" \
            --form-string "expire=120" \
            --form-string "sound=alien" \
            https://api.pushover.net/1/messages.json
